services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your private .env}
      POSTGRES_DB: bizflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizflow -d bizflow"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://bizflow:${POSTGRES_PASSWORD}@database:5432/bizflow
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
  gateway:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend, frontend]
volumes:
  postgres-data:
